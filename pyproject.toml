[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ytdownloader"
version = "1.0.0"
description = "YouTube video downloader reverse-engineering YouTube's video delivery"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "requests>=2.28.0",
]

[project.scripts]
ytdownloader = "ytdownloader.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ytdownloader*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
